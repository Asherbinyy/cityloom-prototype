<head>

  <script>
    // Invalidate stale Service Worker and cache from older builds
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.update();
        }
      });
    }

    // Normalize /docs/ URL to root /cityloom-prototype/ seamlessly
    if (window.location.pathname.endsWith('/docs') || window.location.pathname.endsWith('/docs/')) {
      var cleanPath = window.location.pathname.replace(/\/docs\/?$/, '') + '/';
      window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
    }
  </script>

  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      position: fixed;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      background: #fff4eb;
      background: linear-gradient(180deg, #fff4eb 0%, #fdeada 40%, #f5e1cf 100%);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #fff4eb 0%, #fdeada 50%, #f5e1cf 100%);
      z-index: 999999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s;
    }

    #loading-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px 24px;
      max-width: 360px;
      width: 90%;
    }

    .splash-logo-wrap {
      width: auto;
      height: auto;
      background: transparent;
      padding: 0;
      box-shadow: none;
      margin-bottom: 20px;
      animation: pulseGlow 2.4s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-logo-wrap img {
      width: 140px;
      height: auto;
      object-fit: contain;
      background: transparent;
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .splash-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 30px;
      font-weight: 700;
      color: #2a2a2a;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .splash-subtitle {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fda692;
      margin-bottom: 28px;
    }

    .splash-progress-track {
      width: 180px;
      height: 6px;
      background: rgba(253, 166, 146, 0.25);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .splash-progress-bar {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #fda692, #a5cee4);
      border-radius: 6px;
      position: absolute;
      animation: progressSlide 1.6s ease-in-out infinite;
    }

    @keyframes progressSlide {
      0% { left: -45%; }
      50% { left: 40%; width: 55%; }
      100% { left: 100%; width: 45%; }
    }

    .splash-loading-text {
      margin-top: 14px;
      font-size: 12px;
      color: #6b6b6b;
      font-style: italic;
    }
  </style>

  <script>
    // Web Audio Synthesizer for instant native-feel sound effects
    var cityLoomAudioCtx = null;

    function getCityLoomAudioCtx() {
      if (!cityLoomAudioCtx) {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          cityLoomAudioCtx = new AudioCtx();
        }
      }
      if (cityLoomAudioCtx && cityLoomAudioCtx.state === 'suspended') {
        cityLoomAudioCtx.resume();
      }
      return cityLoomAudioCtx;
    }

    window.cityLoomSound = {
      playUnlock: function() {
        try {
          var ctx = getCityLoomAudioCtx();
          if (!ctx) return;
          var notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach(function(freq, i) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            var t = ctx.currentTime + (i * 0.11);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.12, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
            osc.frequency.value = freq;
            osc.start(t);
            osc.stop(t + 0.36);
          });
        } catch(e) { console.warn(e); }
      },

      playCongrats: function() {
        try {
          var ctx = getCityLoomAudioCtx();
          if (!ctx) return;
          var notes = [523, 659, 784, 1047, 784, 1047, 1319, 1568];
          notes.forEach(function(freq, i) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            var t = ctx.currentTime + (i * 0.09);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(i < 4 ? 0.10 : 0.14, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
            osc.frequency.value = freq;
            osc.start(t);
            osc.stop(t + 0.39);
          });
          // Sustained celebratory major triad chord
          var chord = [1046.50, 1318.51, 1567.98];
          chord.forEach(function(freq) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            var t = ctx.currentTime + 0.75;
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.09, t + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.95);
            osc.frequency.value = freq;
            osc.start(t);
            osc.stop(t + 0.96);
          });
        } catch(e) { console.warn(e); }
      },

      playCorrect: function() {
        try {
          var ctx = getCityLoomAudioCtx();
          if (!ctx) return;
          var notes = [659.25, 987.77]; // E5, B5
          notes.forEach(function(freq, i) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'triangle';
            var t = ctx.currentTime + (i * 0.08);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.12, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
            osc.frequency.value = freq;
            osc.start(t);
            osc.stop(t + 0.29);
          });
        } catch(e) { console.warn(e); }
      },

      playIncorrect: function() {
        try {
          var ctx = getCityLoomAudioCtx();
          if (!ctx) return;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sawtooth';
          var t = ctx.currentTime;
          gain.gain.setValueAtTime(0.08, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          osc.frequency.setValueAtTime(220, t);
          osc.frequency.exponentialRampToValueAtTime(140, t + 0.2);
          osc.start(t);
          osc.stop(t + 0.23);
        } catch(e) { console.warn(e); }
      },

      playFootstep: function() {
        try {
          var ctx = getCityLoomAudioCtx();
          if (!ctx) return;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          var t = ctx.currentTime;
          var pitch = 130 + Math.random() * 30;
          gain.gain.setValueAtTime(0.05, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
          osc.frequency.setValueAtTime(pitch, t);
          osc.frequency.exponentialRampToValueAtTime(70, t + 0.08);
          osc.start(t);
          osc.stop(t + 0.1);
        } catch(e) { console.warn(e); }
      },

      playTap: function() {
        try {
          var ctx = getCityLoomAudioCtx();
          if (!ctx) return;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          var t = ctx.currentTime;
          gain.gain.setValueAtTime(0.06, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
          osc.frequency.setValueAtTime(720, t);
          osc.start(t);
          osc.stop(t + 0.05);
        } catch(e) { console.warn(e); }
      },

      playLocked: function() {
        try {
          if (navigator.vibrate) {
            navigator.vibrate([40, 30, 40]);
          }
          var ctx = getCityLoomAudioCtx();
          if (!ctx) return;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'square';
          var t = ctx.currentTime;
          gain.gain.setValueAtTime(0.04, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          osc.frequency.setValueAtTime(160, t);
          osc.start(t);
          osc.stop(t + 0.13);
        } catch(e) { console.warn(e); }
      }
    };

    window.cityLoomTTS = {
      speaking: false,
      paused: false,
      rate: 0.92,
      currentText: '',
      charOffset: 0,
      cachedVoice: null,

      initVoices: function() {
        if (!('speechSynthesis' in window)) return;
        var self = this;
        function load() {
          var voices = window.speechSynthesis.getVoices();
          if (voices && voices.length > 0) {
            self.cachedVoice = self.getBestVoice();
          }
        }
        window.speechSynthesis.onvoiceschanged = load;
        load();
      },

      getBestVoice: function() {
        if (!('speechSynthesis' in window)) return null;
        var voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return null;

        // Preferred female, natural and Scottish/UK/English voices
        var preferredFemale = [
          'Google UK English Female',
          'Fiona',              // Scottish English (Perfect for Edinburgh)
          'Serena',             // British English Female (iOS premium)
          'Martha',             // British English Female (iOS)
          'Stephanie',          // British English Female
          'Moira',              // Irish/UK Female
          'Karen',              // English Female
          'Samantha',           // US English Female (High clarity)
          'Victoria',           // English Female
          'Tessa',              // English Female
          'Kate',               // English Female
          'Google US English Female',
          'Google US English'
        ];

        // 1. Check preferred high-quality female list
        for (var p = 0; p < preferredFemale.length; p++) {
          for (var v = 0; v < voices.length; v++) {
            var name = voices[v].name || '';
            if (name.indexOf(preferredFemale[p]) !== -1) {
              return voices[v];
            }
          }
        }

        // 2. Any voice explicitly tagged female/woman
        for (var v = 0; v < voices.length; v++) {
          var name = (voices[v].name || '').toLowerCase();
          if (name.includes('female') || name.includes('woman') || name.includes('girl')) {
            return voices[v];
          }
        }

        // 3. Exclude known male voice names (Daniel, Oliver, George, Arthur, Fred, Alex)
        var maleNames = ['daniel', 'oliver', 'george', 'arthur', 'fred', 'alex', 'david', 'male', 'man', 'guy'];
        for (var v = 0; v < voices.length; v++) {
          var name = (voices[v].name || '').toLowerCase();
          var isMale = maleNames.some(function(m) { return name.includes(m); });
          if (!isMale && voices[v].lang && voices[v].lang.startsWith('en')) {
            return voices[v];
          }
        }

        return voices[0];
      },

      speak: function(text, rate, startOffset) {
        try {
          if (!('speechSynthesis' in window)) return;
          window.speechSynthesis.cancel();
          this.currentText = text;
          if (rate) this.rate = rate;
          this.charOffset = startOffset || 0;

          var textToSpeak = text;
          if (startOffset && startOffset > 0 && startOffset < text.length) {
            textToSpeak = text.substring(startOffset);
          }

          var utter = new SpeechSynthesisUtterance(textToSpeak);
          utter.rate = this.rate || 0.92;
          utter.pitch = 1.05; // Natural feminine pitch

          var voice = this.cachedVoice || this.getBestVoice();
          if (voice) {
            utter.voice = voice;
            this.cachedVoice = voice;
          }
          utter.lang = voice ? voice.lang : 'en-GB';

          var self = this;
          utter.onboundary = function(event) {
            if (event && (event.name === 'word' || typeof event.charIndex === 'number')) {
              self.charOffset = (startOffset || 0) + (event.charIndex || 0);
            }
          };

          utter.onstart = function() {
            self.speaking = true;
            self.paused = false;
          };
          utter.onpause = function() {
            self.paused = true;
          };
          utter.onresume = function() {
            self.paused = false;
          };
          utter.onend = function() {
            self.speaking = false;
            self.paused = false;
            self.charOffset = 0;
          };
          utter.onerror = function() {
            self.speaking = false;
            self.paused = false;
          };

          window.speechSynthesis.speak(utter);
        } catch(e) { console.warn(e); }
      },

      pause: function() {
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.pause();
            this.paused = true;
          }
        } catch(e) { console.warn(e); }
      },

      resume: function() {
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.resume();
            this.paused = false;
          }
        } catch(e) { console.warn(e); }
      },

      restart: function() {
        if (this.currentText) {
          this.speak(this.currentText, this.rate, 0);
        }
      },

      setSpeed: function(rate) {
        this.rate = rate;
        if (this.speaking && this.currentText) {
          // Seamlessly continue from current word boundary at new speed without restarting from zero!
          var offset = this.charOffset || 0;
          this.speak(this.currentText, rate, offset);
        }
      },

      stop: function() {
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
          this.speaking = false;
          this.paused = false;
          this.charOffset = 0;
        } catch(e) { console.warn(e); }
      }
    };

    // Pre-initialize voices
    window.cityLoomTTS.initVoices();

    window.cityLoomSTT = {
      recognition: null,
      listening: false,
      callback: null,

      startListening: function(onResult) {
        try {
          var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRec) {
            console.warn('Speech recognition not available in this browser.');
            return false;
          }
          if (this.recognition) {
            try { this.recognition.abort(); } catch(e) {}
          }
          this.callback = onResult;
          var rec = new SpeechRec();
          this.recognition = rec;
          rec.continuous = false;
          rec.interimResults = false;
          rec.lang = 'en-GB';

          rec.onstart = function() {
            window.cityLoomSTT.listening = true;
          };
          rec.onresult = function(event) {
            window.cityLoomSTT.listening = false;
            if (event.results && event.results.length > 0) {
              var transcript = event.results[0][0].transcript;
              if (window.cityLoomSTT.callback) {
                window.cityLoomSTT.callback(transcript);
              }
            }
          };
          rec.onerror = function(err) {
            console.warn('STT error:', err);
            window.cityLoomSTT.listening = false;
          };
          rec.onend = function() {
            window.cityLoomSTT.listening = false;
          };
          rec.start();
          return true;
        } catch(e) {
          console.warn('STT exception:', e);
          return false;
        }
      },

      stopListening: function() {
        try {
          if (this.recognition) {
            this.recognition.stop();
          }
          this.listening = false;
        } catch(e) {}
      }
    };

    function hideSplash() {
      var splash = document.getElementById('loading-splash');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }

    // Hide splash when Flutter engine renders the first frame
    window.addEventListener('flutter-first-frame', hideSplash);

    // Dynamic observer: dismiss splash as soon as Flutter canvas mounts
    var checkCount = 0;
    var splashInterval = setInterval(function() {
      checkCount++;
      var flutterView = document.querySelector('flutter-view') || 
                        document.querySelector('flt-glass-pane') ||
                        document.querySelector('flt-scene-host');
      if (flutterView || checkCount >= 40) {
        hideSplash();
        clearInterval(splashInterval);
      }
    }, 200);
  </script>
